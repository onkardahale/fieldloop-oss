# Build and ship the `fieldloop` Python wheels.
#
# The wheel is abi3 (`abi3-py312`), so one wheel per platform serves every CPython >= 3.12 —
# each platform builds exactly once, no per-version matrix. A version tag (`vX.Y.Z`) builds
# wheels for the major platforms + an sdist, then attaches them to the GitHub Release.
# PyPI publishing is OFF unless explicitly opted in (see the `pypi` job) so a tag can never
# publish by accident.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/fieldloop-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/fieldloop-py/dist/*.whl

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: macos-13, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/fieldloop-py
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/fieldloop-py/dist/*.whl

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/fieldloop-py
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: crates/fieldloop-py/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/fieldloop-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/fieldloop-py/dist/*.tar.gz

  release:
    name: Attach artifacts to the GitHub Release
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    # Only a tag push cuts a release; a manual run just exercises the build matrix above.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish wheels + sdist to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  pypi:
    name: Publish to PyPI (opt-in)
    needs: [release]
    runs-on: ubuntu-latest
    # Stays off until you flip it on: it runs only from the public repo AND only when the
    # repo variable PUBLISH_TO_PYPI is "true" AND PyPI Trusted Publishing is configured for
    # the `pypi` environment. Until then, releases ship wheels via GitHub Releases only.
    if: >-
      startsWith(github.ref, 'refs/tags/')
      && github.repository == 'onkardahale/fieldloop-oss'
      && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
