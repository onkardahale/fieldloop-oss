# Local servers for the OPT-IN live-db integration tests only.
#
# The default build and the closed-loop check need NOTHING here: the crate's value is
# pure SQL/row generation, unit-tested without a database. These containers exist only
# so an operator can run the `#[ignore]`d integration tests behind the `live-db`
# feature:
#
#   docker compose -f crates/fieldloop-store/docker-compose.yml up -d
#   CLICKHOUSE_URL=http://localhost:8123 CLICKHOUSE_USER=fieldloop CLICKHOUSE_PASSWORD=fieldloop \
#     DATABASE_URL=postgres://fieldloop:fieldloop@localhost:5432/fieldloop \
#     cargo test -p fieldloop-store --features live-db -- --ignored
#
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      # The stock image ships a users.d/default-user.xml that pins the password-less
      # `default` user to localhost only (<ip>::1</ip>, <ip>127.0.0.1</ip>). The live
      # tests connect from the host through Docker's gateway IP, so `default` 403s with
      # AUTHENTICATION_FAILED. Setting CLICKHOUSE_USER makes the image provision a
      # `fieldloop` user reachable from any network with this password (mirrors the
      # Postgres creds below); the client sends it as HTTP basic auth.
      CLICKHOUSE_USER: fieldloop
      CLICKHOUSE_PASSWORD: fieldloop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP interface the thin client posts INSERT ... FORMAT JSONEachRow to
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldloop
      POSTGRES_PASSWORD: fieldloop
      POSTGRES_DB: fieldloop
    ports:
      - "5432:5432"
